name: Candidate

# Replays release.yml's verify and build jobs, up to publication, on a release candidate before it is tagged.
# A controller pushes the candidate as candidate/<version> with the VPS token, which cannot push workflow files.
on:
  push:
    branches: ['candidate/**']

permissions:
  contents: read

concurrency:
  group: candidate-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # release.yml's verify, minus the tag checks: Cargo.toml's version stands in for the tag's.
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A command this replay runs that release.yml no longer runs means the two have drifted apart.
      - name: The replay still matches release.yml
        run: |
          set -euo pipefail
          for line in \
            'run: packaging/flea-release-build install-deps' \
            'run: packaging/flea-release-build test' \
            'run: packaging/flea-release-build build' \
            'run: packaging/flea-release-build stage' \
            'run: packaging/flea-release-build check' \
            'versioned_pkgbuilds=(PKGBUILD packaging/flea-bin/PKGBUILD)' \
            'if ! diff <(closure PKGBUILD) <(closure packaging/flea-bin/PKGBUILD); then'; do
            grep -qF -- "$line" .github/workflows/release.yml \
              || { echo "::error::release.yml no longer runs: $line; update candidate.yml with it"; exit 1; }
          done

      - id: check
        name: Cargo.toml and every PKGBUILD agree
        run: |
          set -euo pipefail
          # Sample input: Cargo.toml line `version = "0.3.3"`.
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Cargo.toml version '$version' is not X.Y.Z"; exit 1; }
          fail=0
          check() { # check <what> <actual> <expected>
            if [ "$2" != "$3" ]; then
              echo "::error::$1 is '$2' but Cargo.toml says '$3'"; fail=1
            fi
          }
          versioned_pkgbuilds=(PKGBUILD packaging/flea-bin/PKGBUILD)
          for pkgbuild in "${versioned_pkgbuilds[@]}"; do
            # Sample input: PKGBUILD line `pkgver=0.3.3`.
            check "$pkgbuild pkgver" "$(grep -m1 '^pkgver=' "$pkgbuild" | cut -d= -f2)" "$version"
          done
          closure() {
            bash -c 'source "./$1"; printf "%s\n" "depends:" "${depends[@]}" "optdepends:" "${optdepends[@]}"' _ "$1"
          }
          # flea-bin packages the release's prebuilt binary, so it needs exactly what the root package needs.
          if ! diff <(closure PKGBUILD) <(closure packaging/flea-bin/PKGBUILD); then
            echo "::error::packaging/flea-bin/PKGBUILD's depends or optdepends differ from PKGBUILD's"; fail=1
          fi
          [ "$fail" -eq 0 ] || exit 1
          FLEA_FIXTURE_ROOT=/tmp/flea-package-verify tests/figure-package.sh
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "verified candidate $version at $GITHUB_SHA"

  # release.yml's build job without the artifact upload: the same runners, packages, tests and tarball check.
  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # The GPUI workspace tests and the release build ran past 30 minutes on hosted runners (Candidate run 41508630731).
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: stable

      - name: Install what GPUI and the test suite need
        run: packaging/flea-release-build install-deps

      # The debug flea-gui build outgrew the arm runner's memory and the runner was shut down (run 41513658726).
      - name: Add swap for the debug GPUI build
        run: |
          free -h && df -h /
          sudo fallocate -l 8G /flea-swap && sudo chmod 600 /flea-swap
          sudo mkswap /flea-swap >/dev/null && sudo swapon /flea-swap && free -h

      - name: Test
        env:
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
        run: packaging/flea-release-build test

      - name: Build
        run: packaging/flea-release-build build

      - name: Stage the flea-bin tarball
        run: packaging/flea-release-build stage

      - name: The tarball holds every path flea-bin's package() installs
        run: packaging/flea-release-build check
