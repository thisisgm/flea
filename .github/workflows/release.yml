name: Release

# A vX.Y.Z tag is a release; docs/release.md says what each job does and how to run each step by hand.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Existing vX.Y.Z tag to build again'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.ref || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_REF: ${{ inputs.ref || github.ref_name }}

jobs:
  # Nothing downstream may publish a version, closure or file set the tree does not agree on.
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Qualified, so a branch that shares the tag's name can never be what is checked out.
          ref: ${{ inputs.ref && format('refs/tags/{0}', inputs.ref) || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - id: check
        name: The tag, Cargo.toml and every PKGBUILD agree
        run: |
          set -euo pipefail
          ref="$RELEASE_REF"
          [[ "$ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::'$ref' is not a vX.Y.Z tag; releases build exact version tags only"; exit 1; }
          # The aur environment admits v* refs only, so a run started from a branch would publish and then be refused.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" != "refs/tags/$ref" ]; then
            echo "::error::start Run workflow from the tag itself (Use workflow from: $ref), not from $GITHUB_REF"; exit 1
          fi
          version="${ref#v}"
          sha=$(git rev-parse -q --verify "refs/tags/$ref^{commit}") \
            || { echo "::error::tag '$ref' does not exist"; exit 1; }
          [ "$(git rev-parse HEAD)" = "$sha" ] \
            || { echo "::error::the checkout is not the commit tag '$ref' names"; exit 1; }

          fail=0
          check() { # check <what> <actual> <expected>
            if [ "$2" != "$3" ]; then
              echo "::error::$1 is '$2' but the tag says '$3'"; fail=1
            fi
          }
          # Sample input: Cargo.toml line `version = "0.3.3"`.
          check "Cargo.toml version" \
            "$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)" "$version"
          # flea-git is not here: its pkgver is what pkgver() prints, and publish-aur writes it.
          versioned_pkgbuilds=(PKGBUILD packaging/flea-bin/PKGBUILD packaging/flea/PKGBUILD)
          aur_pkgbuilds=(packaging/flea-bin/PKGBUILD packaging/flea/PKGBUILD packaging/flea-git/PKGBUILD)
          for pkgbuild in "${versioned_pkgbuilds[@]}"; do
            # Sample input: PKGBUILD line `pkgver=0.3.3`.
            check "$pkgbuild pkgver" "$(grep -m1 '^pkgver=' "$pkgbuild" | cut -d= -f2)" "$version"
          done

          # Every file is this tree's own, so sourcing them for their closure is what makepkg does.
          closure() {
            # ./ anchors the file: a bare name is looked up on PATH first, where a PKGBUILD executable would win.
            bash -c 'source "./$1"; printf "%s\n" "depends:" "${depends[@]}" "optdepends:" "${optdepends[@]}"' _ "$1"
          }
          # Sample input: from `package() {` to the next line that is exactly `}`, minus comments, blank lines, the cd line and the binary line.
          body() { sed -n '/^package() {/,/^}/p' "$1" | grep -v -E '^[[:space:]]*(#|$)|^  cd |/usr/bin/flea(-gui)?"$'; }
          for pkgbuild in "${aur_pkgbuilds[@]}"; do
            if ! diff <(closure PKGBUILD) <(closure "$pkgbuild"); then
              echo "::error::$pkgbuild's depends or optdepends differ from PKGBUILD's"; fail=1
            fi
            if ! diff <(body PKGBUILD) <(body "$pkgbuild"); then
              echo "::error::$pkgbuild's package() has drifted from PKGBUILD's"; fail=1
            fi
          done

          [ "$fail" -eq 0 ] || exit 1
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "verified $ref"

  # One native runner per architecture, so the aarch64 binary is one its own test suite ran on.
  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false

      # A master commit, because dtolnay recreates the version branches and orphans a commit pinned from one.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: stable

      # bsdtar, gio, libvulkan.so.1 and bwrap are what the suite calls beyond coreutils; it must run as a non-root user.
      - name: Install what GPUI and the test suite need
        run: packaging/flea-release-build install-deps

      - name: Test
        run: packaging/flea-release-build test

      - name: Build
        run: packaging/flea-release-build build

      - name: Stage the flea-bin tarball
        run: packaging/flea-release-build stage

      - name: The tarball holds every path flea-bin's package() installs
        run: packaging/flea-release-build check

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flea-bin-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # The source tarball OPR and the AUR flea package build from; the same tag and the same gzip always give the same bytes.
  source:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SHA: ${{ needs.verify.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The same qualified tag verify checked, with the history git archive reads the tag object from.
          ref: ${{ inputs.ref && format('refs/tags/{0}', inputs.ref) || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Build flea-vX.Y.Z.tar.gz from the tag
        run: |
          set -euo pipefail
          [ "$(git rev-parse "refs/tags/$RELEASE_REF^{commit}")" = "$SHA" ] \
            || { echo "::error::tag '$RELEASE_REF' no longer names $SHA, the commit verify checked"; exit 1; }
          packaging/flea-source-tarball "$RELEASE_REF" dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flea-source
          path: dist/*
          if-no-files-found: error

  # Creates the release or attaches to one; it never replaces a published asset, whose checksum the AUR or OPR pins.
  release:
    needs: [verify, build, source]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: The artifacts still match their sidecars
        run: cd dist && sha256sum -c ./*.sha256

      # sha256sum's own "<hash>  <name>" lines, which OPR's upstream.sh reads with awk '$2 == asset'.
      - name: Write SHASUMS256.txt over every asset
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- flea-* > SHASUMS256.txt
          sha256sum -c SHASUMS256.txt
          source_asset="flea-$RELEASE_REF.tar.gz"
          # Sample input: "<64 hex>  flea-v0.3.3.tar.gz", which OPR accepts only as the one line for that name.
          sum=$(awk -v asset="$source_asset" '$2 == asset { print $1 }' SHASUMS256.txt)
          [[ "$sum" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::SHASUMS256.txt has no single line for $source_asset"; exit 1; }

      - name: Create the release or attach to it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$RELEASE_REF"
          # Read at use time, not at verify, so a newer tag pushed mid-run is seen; the remote prints "<sha>\trefs/tags/v0.3.3".
          newest=$(git ls-remote --tags --refs origin 'v*' | cut -f2 | cut -d/ -f3 | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          latest=false; [ "$tag" = "$newest" ] && latest=true
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Sample input: one published asset name per line, e.g. "flea-v0.3.3-linux-x86_64.tar.gz".
            published=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            for asset in dist/*; do
              if grep -qxF "$(basename "$asset")" <<< "$published"; then
                echo "::error::$tag already carries $(basename "$asset"), whose checksum the AUR or OPR pins; delete it from the release by hand to replace it on purpose"
                exit 1
              fi
            done
            gh release upload "$tag" dist/* --repo "$GITHUB_REPOSITORY"
            echo "attached the tarballs, their sidecars and SHASUMS256.txt to the existing $tag release"
          else
            notes="docs/release-notes-$VERSION.md"
            if [ -f "$notes" ]; then
              gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --title "$tag" --verify-tag --latest="$latest" --notes-file "$notes"
            else
              gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --title "$tag" --verify-tag --latest="$latest" --generate-notes
            fi
            echo "created the $tag release"
          fi

  # One leg per AUR package, each its own job, so a package the key cannot push yet fails red alone and the others still publish.
  publish-aur:
    needs: [verify, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The only holder of AUR_SSH_KEY; docs/release.md limits it to v* tags, so only a tag's own tree ever reads the key.
    environment: aur
    strategy:
      fail-fast: false
      matrix:
        package: [flea-bin, flea, flea-git]
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      SHA: ${{ needs.verify.outputs.sha }}
      PACKAGE: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: matrix.package == 'flea-bin'
        with:
          path: dist
          merge-multiple: true

      # The tree's PKGBUILD says SKIP so that a version bump is one line; the AUR gets real hashes.
      - name: Pin the flea-bin checksums
        if: matrix.package == 'flea-bin'
        run: |
          set -euo pipefail
          # Sample input: a sha256sum sidecar line `<64 hex>  flea-v0.3.3-linux-x86_64.tar.gz`.
          x86=$(cut -d' ' -f1 "dist/flea-v$VERSION-linux-x86_64.tar.gz.sha256")
          arm=$(cut -d' ' -f1 "dist/flea-v$VERSION-linux-aarch64.tar.gz.sha256")
          for pair in "x86_64 $x86" "aarch64 $arm"; do
            [[ "${pair#* }" =~ ^[0-9a-f]{64}$ ]] || {
              echo "::error::dist/flea-v$VERSION-linux-${pair%% *}.tar.gz.sha256 starts '${pair#* }', not a sha256"; exit 1; }
          done
          sed -i "s/^sha256sums_x86_64=.*/sha256sums_x86_64=('$x86')/" packaging/flea-bin/PKGBUILD
          sed -i "s/^sha256sums_aarch64=.*/sha256sums_aarch64=('$arm')/" packaging/flea-bin/PKGBUILD
          if grep -q "'SKIP'" packaging/flea-bin/PKGBUILD; then
            echo "::error::a SKIP survived pinning; the AUR never receives one"; exit 1
          fi
          grep '^sha256sums_' packaging/flea-bin/PKGBUILD

      - name: Prove the flea-bin PKGBUILD against the published release
        if: matrix.package == 'flea-bin'
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/packaging/flea-bin/PKGBUILD:/pkg/PKGBUILD:ro" -v "$PWD/packaging/flea-default-check:/pkg/flea-default-check:ro" \
            -e "VERSION=$VERSION" archlinux:base-devel bash -euo pipefail -c '
            useradd -m build
            mkdir /home/build/pkg && cp /pkg/PKGBUILD /home/build/pkg/ && chown -R build /home/build/pkg
            cd /home/build/pkg
            # The package names carry the pkgrel of the PKGBUILD, which a rebuilt release raises past 1.
            rel=$(sed -n "s/^pkgrel=//p" PKGBUILD)
            # makepkg refuses root; package() only installs files, so an aarch64 makepkg.conf builds it on this host.
            sed "s/^CARCH=.*/CARCH=\"aarch64\"/; s/^CHOST=.*/CHOST=\"aarch64-unknown-linux-gnu\"/" /etc/makepkg.conf > /home/build/makepkg-aarch64.conf
            su build -c "makepkg --nodeps --noconfirm --clean"
            su build -c "makepkg --nodeps --noconfirm --clean --config /home/build/makepkg-aarch64.conf"
            su build -c "makepkg --printsrcinfo" | tee .SRCINFO
            list() { bsdtar -tf "$1" | grep -v "^\." | sort; }
            list "flea-bin-$VERSION-$rel-x86_64.pkg.tar.zst" > x86_64.list
            list "flea-bin-$VERSION-$rel-aarch64.pkg.tar.zst" > aarch64.list
            diff x86_64.list aarch64.list
            need() { grep -qx "$1" x86_64.list || { echo "::error::flea-bin $VERSION packages no $1"; exit 1; }; }
            need usr/bin/flea
            need usr/bin/flea-gui
            need usr/share/flea/ui/boot/shell.qml
            echo "flea-bin $VERSION packages $(wc -l < x86_64.list) paths on both architectures"
            /pkg/flea-default-check "flea-bin-$VERSION-$rel-x86_64.pkg.tar.zst"
          '

      # OPR's upstream.sh verifies the source tarball against this same manifest line, so both channels pin one checksum.
      - name: Pin the flea checksum from the published SHASUMS256.txt
        if: matrix.package == 'flea'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_REF" --repo "$GITHUB_REPOSITORY" --pattern SHASUMS256.txt --dir "$RUNNER_TEMP"
          source_asset="flea-$RELEASE_REF.tar.gz"
          # Sample input: "<64 hex>  flea-v0.3.3.tar.gz", read with the awk OPR's upstream.sh uses.
          sum=$(awk -v asset="$source_asset" '$2 == asset { print $1 }' "$RUNNER_TEMP/SHASUMS256.txt")
          [[ "$sum" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::the published SHASUMS256.txt has no single line for $source_asset"; exit 1; }
          sed -i "s/^sha256sums=.*/sha256sums=('$sum')/" packaging/flea/PKGBUILD
          if grep -q "'SKIP'" packaging/flea/PKGBUILD; then
            echo "::error::a SKIP survived pinning; the AUR never receives one"; exit 1
          fi
          grep '^sha256sums=' packaging/flea/PKGBUILD

      # --nocheck: check() needs qml6 and an installed Omarchy, and the build job already ran cargo test on this commit.
      - name: Prove the flea PKGBUILD against the published source tarball
        if: matrix.package == 'flea'
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/packaging/flea/PKGBUILD:/pkg/PKGBUILD:ro" -v "$PWD/packaging/flea-default-check:/pkg/flea-default-check:ro" \
            -e "VERSION=$VERSION" archlinux:base-devel bash -euo pipefail -c '
            pacman -Syu --noconfirm --needed --noprogressbar rust git pkgconf fontconfig freetype2 libxcb libxkbcommon libxkbcommon-x11 wayland libglvnd libx11 vulkan-icd-loader
            useradd -m build
            mkdir /home/build/pkg && cp /pkg/PKGBUILD /home/build/pkg/ && chown -R build /home/build/pkg
            cd /home/build/pkg
            rel=$(sed -n "s/^pkgrel=//p" PKGBUILD)
            su build -c "makepkg --nodeps --nocheck --noconfirm --clean"
            bsdtar -tf "flea-$VERSION-$rel-x86_64.pkg.tar.zst" | grep -v "^\." | sort > flea.list
            need() { grep -qx "$1" flea.list || { echo "::error::flea $VERSION packages no $1"; exit 1; }; }
            need usr/bin/flea
            need usr/bin/flea-gui
            need usr/share/flea/ui/boot/shell.qml
            echo "flea $VERSION packages $(wc -l < flea.list) paths built from the published source tarball"
            /pkg/flea-default-check "flea-$VERSION-$rel-x86_64.pkg.tar.zst"
          '

      # What pkgver() prints on the tag itself; aur-push ignores this line when it decides whether flea-git changed.
      - name: Give flea-git the tag's own pkgver
        if: matrix.package == 'flea-git'
        run: |
          set -euo pipefail
          # pkgver() asks git describe for this many hex digits.
          abbrev=7
          sed -i "s/^pkgver=.*/pkgver=$VERSION.r0.g${SHA:0:abbrev}/" packaging/flea-git/PKGBUILD
          grep '^pkgver=' packaging/flea-git/PKGBUILD

      - id: gate
        name: Decide whether this tag pushes to the AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          AUR_COMMIT_NAME: ${{ vars.AUR_COMMIT_NAME }}
          AUR_COMMIT_EMAIL: ${{ vars.AUR_COMMIT_EMAIL }}
        run: |
          set -euo pipefail
          # Read at use time, not at verify, so a newer tag pushed mid-run is seen; the remote prints "<sha>\trefs/tags/v0.3.3".
          newest=$(git ls-remote --tags --refs origin 'v*' | cut -f2 | cut -d/ -f3 | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          if [ "$RELEASE_REF" != "$newest" ]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=AUR push skipped::$RELEASE_REF is not the newest release tag, and the AUR keeps the newer version"
            exit 0
          fi
          missing=""
          for name in AUR_SSH_KEY AUR_COMMIT_NAME AUR_COMMIT_EMAIL; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
            # Loud but green: a release before the AUR account exists still ships, and "Re-run this job" pushes it later.
            echo "::warning title=AUR push skipped::$PACKAGE was not pushed:$missing not set; docs/release.md sets them up once"
            exit 0
          fi
          echo "push=true" >> "$GITHUB_OUTPUT"

      # Inside Arch because makepkg writes .SRCINFO; the AUR host keys are pinned in packaging/aur.known_hosts, never scanned.
      - name: Push ${{ matrix.package }} to the AUR
        if: steps.gate.outputs.push == 'true'
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          AUR_COMMIT_NAME: ${{ vars.AUR_COMMIT_NAME }}
          AUR_COMMIT_EMAIL: ${{ vars.AUR_COMMIT_EMAIL }}
        run: |
          set -euo pipefail
          # On stdin, since docker run -e keeps the value in the container's on-disk config; aur-push loads it into an agent.
          printf '%s\n' "$AUR_SSH_KEY" | docker run --rm -i -v "$PWD:/repo:ro" -e AUR_COMMIT_NAME -e AUR_COMMIT_EMAIL \
            archlinux:base-devel bash -euo pipefail -c '
              AUR_SSH_KEY=$(cat)
              export AUR_SSH_KEY
              env -u AUR_SSH_KEY pacman -Syu --noconfirm --needed --noprogressbar git openssh </dev/null
              useradd -m build
              runuser -u build -- /repo/packaging/aur-push "$@" </dev/null
            ' _ "$PACKAGE" "/repo/packaging/$PACKAGE/PKGBUILD" "$PACKAGE $RELEASE_REF"
