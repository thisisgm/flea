name: Release

# A vX.Y.Z tag is a release; docs/release.md says what each job does and how to run each step by hand.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Existing vX.Y.Z tag to build again'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.ref || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_REF: ${{ inputs.ref || github.ref_name }}

jobs:
  # Nothing downstream may publish a version, closure or file set the tree does not agree on.
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Qualified, so a branch that shares the tag's name can never be what is checked out.
          ref: ${{ inputs.ref && format('refs/tags/{0}', inputs.ref) || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - id: check
        name: The tag, Cargo.toml and every PKGBUILD agree
        run: |
          set -euo pipefail
          ref="$RELEASE_REF"
          [[ "$ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::'$ref' is not a vX.Y.Z tag; releases build exact version tags only"; exit 1; }
          # Started from a branch, the run would follow that branch's release.yml rather than the tag's.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" != "refs/tags/$ref" ]; then
            echo "::error::start Run workflow from the tag itself (Use workflow from: $ref), not from $GITHUB_REF"; exit 1
          fi
          version="${ref#v}"
          sha=$(git rev-parse -q --verify "refs/tags/$ref^{commit}") \
            || { echo "::error::tag '$ref' does not exist"; exit 1; }
          [ "$(git rev-parse HEAD)" = "$sha" ] \
            || { echo "::error::the checkout is not the commit tag '$ref' names"; exit 1; }

          fail=0
          check() { # check <what> <actual> <expected>
            if [ "$2" != "$3" ]; then
              echo "::error::$1 is '$2' but the tag says '$3'"; fail=1
            fi
          }
          # Sample input: Cargo.toml line `version = "0.3.3"`.
          check "Cargo.toml version" \
            "$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)" "$version"
          versioned_pkgbuilds=(PKGBUILD packaging/flea-bin/PKGBUILD)
          for pkgbuild in "${versioned_pkgbuilds[@]}"; do
            # Sample input: PKGBUILD line `pkgver=0.3.3`.
            check "$pkgbuild pkgver" "$(grep -m1 '^pkgver=' "$pkgbuild" | cut -d= -f2)" "$version"
          done

          # Every file is this tree's own, so sourcing them for their closure is what makepkg does.
          closure() {
            # ./ anchors the file: a bare name is looked up on PATH first, where a PKGBUILD executable would win.
            bash -c 'source "./$1"; printf "%s\n" "depends:" "${depends[@]}" "optdepends:" "${optdepends[@]}"' _ "$1"
          }
          # flea-bin packages the release's prebuilt binary, so it needs exactly what the root package needs.
          if ! diff <(closure PKGBUILD) <(closure packaging/flea-bin/PKGBUILD); then
            echo "::error::packaging/flea-bin/PKGBUILD's depends or optdepends differ from PKGBUILD's"; fail=1
          fi

          [ "$fail" -eq 0 ] || exit 1
          FLEA_FIXTURE_ROOT=/tmp/flea-package-verify tests/figure-package.sh
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "verified $ref"

  # One native runner per architecture, so the aarch64 binary is one its own test suite ran on.
  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # The GPUI workspace tests and the release build ran past 30 minutes on hosted runners (Candidate run 41508630731).
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false

      # A master commit, because dtolnay recreates the version branches and orphans a commit pinned from one.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: stable

      # bsdtar, gio, libvulkan.so.1 and bwrap are what the suite calls beyond coreutils; it must run as a non-root user.
      - name: Install what GPUI and the test suite need
        run: packaging/flea-release-build install-deps

      # The debug flea-gui build outgrew the arm runner's memory and the runner was shut down (run 41513658726).
      - name: Add swap for the debug GPUI build
        run: |
          free -h && df -h /
          sudo fallocate -l 8G /flea-swap && sudo chmod 600 /flea-swap
          sudo mkswap /flea-swap >/dev/null && sudo swapon /flea-swap && free -h

      - name: Test
        env:
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
        run: packaging/flea-release-build test

      - name: Build
        run: packaging/flea-release-build build

      - name: Stage the flea-bin tarball
        run: packaging/flea-release-build stage

      - name: The tarball holds every path flea-bin's package() installs
        run: packaging/flea-release-build check

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flea-bin-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # The source tarball the OPR flea package builds from; the same tag and the same gzip always give the same bytes.
  source:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SHA: ${{ needs.verify.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The same qualified tag verify checked, with the history git archive reads the tag object from.
          ref: ${{ inputs.ref && format('refs/tags/{0}', inputs.ref) || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Build flea-vX.Y.Z.tar.gz from the tag
        run: |
          set -euo pipefail
          [ "$(git rev-parse "refs/tags/$RELEASE_REF^{commit}")" = "$SHA" ] \
            || { echo "::error::tag '$RELEASE_REF' no longer names $SHA, the commit verify checked"; exit 1; }
          packaging/flea-source-tarball "$RELEASE_REF" dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flea-source
          path: dist/*
          if-no-files-found: error

  # Creates the release or attaches to one; it never replaces a published asset, whose checksum may already be pinned.
  release:
    needs: [verify, build, source]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: The artifacts still match their sidecars
        run: cd dist && sha256sum -c ./*.sha256

      # sha256sum's own "<hash>  <name>" lines, which OPR's upstream.sh reads with awk '$2 == asset'.
      - name: Write SHASUMS256.txt over every asset
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- flea-* > SHASUMS256.txt
          sha256sum -c SHASUMS256.txt
          source_asset="flea-$RELEASE_REF.tar.gz"
          # Sample input: "<64 hex>  flea-v0.3.3.tar.gz", which OPR accepts only as the one line for that name.
          sum=$(awk -v asset="$source_asset" '$2 == asset { print $1 }' SHASUMS256.txt)
          [[ "$sum" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::SHASUMS256.txt has no single line for $source_asset"; exit 1; }

      - name: Create the release or attach to it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$RELEASE_REF"
          # Read at use time, not at verify, so a newer tag pushed mid-run is seen; the remote prints "<sha>\trefs/tags/v0.3.3".
          newest=$(git ls-remote --tags --refs origin 'v*' | cut -f2 | cut -d/ -f3 | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          latest=false; [ "$tag" = "$newest" ] && latest=true
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Sample input: one published asset name per line, e.g. "flea-v0.3.3-linux-x86_64.tar.gz".
            published=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            for asset in dist/*; do
              if grep -qxF "$(basename "$asset")" <<< "$published"; then
                echo "::error::$tag already carries $(basename "$asset"), whose checksum may already be pinned; delete it from the release by hand to replace it on purpose"
                exit 1
              fi
            done
            gh release upload "$tag" dist/* --repo "$GITHUB_REPOSITORY"
            echo "attached the tarballs, their sidecars and SHASUMS256.txt to the existing $tag release"
          else
            notes="docs/release-notes-$VERSION.md"
            if [ -f "$notes" ]; then
              gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --title "$tag" --verify-tag --latest="$latest" --notes-file "$notes"
            else
              gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --title "$tag" --verify-tag --latest="$latest" --generate-notes
            fi
            echo "created the $tag release"
          fi
