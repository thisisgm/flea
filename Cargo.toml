[package]
name = "flea"
version = "0.4.0"
edition = "2021"
license = "MIT"
# src/vulkan.rs uses c"..." literals, stabilised in 1.77; without this the error names rustc, not flea.
rust-version = "1.77"

[workspace]
members = ["crates/flea-gui"]
default-members = ["."]
resolver = "2"

[workspace.dependencies]
# Keep both fork revisions together here; members inherit these declarations.
gpui = { package = "gpui-pre", git = "https://github.com/thisisgm/gpui-omarchy", rev = "8fd191ee376b4004a3793ed8b69fff798509d56f" }
gpui_platform = { package = "gpui-pre-platform", git = "https://github.com/thisisgm/gpui-omarchy", rev = "8fd191ee376b4004a3793ed8b69fff798509d56f", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }

[lib]
path = "src/lib.rs"

[dependencies]

[features]
# Bench-only: the flasher's loop-device seam for a marked root, never enabled by packaging or any default build.
flash-test-seam = []

[profile.release]
opt-level = 3
lto = true
strip = true
# One codegen unit: 47 KB less text and about 80 kB less TUI PSS, paired on minipc.
codegen-units = 1
