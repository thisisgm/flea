[package]
name = "flea-gui"
version = "0.4.3"
edition = "2021"
license = "MIT"

[dependencies]
flea = { path = "../.." }
flate2 = "=1.1.10"
png = "=0.18.1"
gpui = { workspace = true }
gpui_platform = { workspace = true }
async-channel = "=2.5.0"
omi = "=1.0.0"
log = "=0.4.34"
# RenderImage's frame type, in the lock through gpui: PNG for the HTML and font helpers, TIFF and ICO for Quick Look.
image = { version = "=0.25.10", default-features = false, features = ["png", "tiff", "ico"] }
# Grapheme clusters, so a hint never wraps inside one character; in the lock through gpui.
unicode-segmentation = "=1.13.3"
unicode-bidi = "=0.3.18"

[features]
# Bench-only: a benchmark driver's markers and scroll test, never enabled by packaging or any default build.
bench-seam = []

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui_platform = { workspace = true, features = ["test-support"] }
