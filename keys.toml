# The one key table. tools/flea-keymap-gen turns it into ui/js/Keymap.js, which is generated.

# Control-modified keys are checked first, so plain d can mean cut while ctrl-d pages.
[[ctrl]]
key = "D"
action = "pageDown"

[[ctrl]]
key = "U"
action = "pageUp"

[[ctrl]]
key = "A"
action = "selectAll"

# Finder's table with Cmd read as Ctrl, which is also what Omarchy's universal clipboard injects
# (SUPER+C/V/X arrive here as CTRL+C/V/X, see clipboard.lua) and what GTK binds. Every chord is
# additive: the bare vim key beside it stays. Cmd+D is the one Finder chord not taken, because
# Ctrl+D above already pages with Ctrl+U as its pair; Duplicate stays a menu row.
[[ctrl]]
key = "C"
action = "copy"

[[ctrl]]
key = "V"
action = "paste"

[[ctrl]]
key = "X"
action = "cut"

[[ctrl]]
key = "Z"
action = "undo"

[[ctrl]]
key = "F"
action = "search"

# Finder's Cmd+E. ui/js/Eject.js "release" ejects the rail's cursor row or the removable volume the
# listing is inside, with the verdict from Mounts.railMenu, off the lsblk poll, never an exit code.
[[ctrl]]
key = "E"
action = "eject"

# Not a Finder chord: Cmd+Shift+G is Go to Folder there, and Ctrl+Shift+G is nothing on this box.
# Ctrl+L is what Nautilus, Thunar, Dolphin and every browser bind, so the path bar answers to it too.
[[ctrl]]
key = "L"
action = "pathBar"

# Opens the default terminal in the directory being shown, through flea --terminal
# (xdg-terminal-exec --dir=). Ctrl+T is unbound elsewhere here, and bare t below is tabNew.
[[ctrl]]
key = "T"
action = "openTerminal"
# The settings panel's own chord, spelled ctrl-, by both presets and by every editor that has one;
# the bare comma below is the key the Settings board draws beside the toolbar's sliders button.
[[ctrl]]
key = "Comma"
action = "settings"

# Checked before the plain ctrl rows and falling through when unmatched, so Ctrl+Shift+D still
# pages. Ctrl+Shift+N is Nautilus's own New Folder and Finder's with Cmd read as Ctrl, and the
# window reaches the backend's mkdir through Ops.newFolder. Shift+period is delivered as Greater
# on a US layout and as Period elsewhere, so both rows name the one action.
[[ctrlshift]]
key = "N"
action = "newFolder"

# Issue 9: foot's own zoom chords, which in foot are a text size and are one here too. They are an
# alias onto the Display section's own control and its one stored stop, never a second engine. Plus
# and Equal both, because + is Shift+= on this layout and the hand presses the one key either way;
# 0 goes back to following Omarchy, so an override is never a state you are stuck in.
[[ctrlshift]]
key = "Plus"
action = "textSizeUp"

[[ctrlshift]]
key = "Equal"
action = "textSizeUp"

[[ctrlshift]]
key = "Minus"
action = "textSizeDown"

[[ctrlshift]]
key = "Underscore"
action = "textSizeDown"

[[ctrlshift]]
key = "0"
action = "textSizeReset"

[[ctrlshift]]
key = "Greater"
action = "toggleHidden"

[[ctrlshift]]
key = "Period"
action = "toggleHidden"

# Shift falls through instead of returning, because shift-modified letters already carry their
# own capital text (see G below); this table only covers the arrow keys, which carry no text.
# The preset overlay, the four-value chooser the Keys settings section walks: default, vim, mac and
# windows, in SettingsKeys.html's own order. It is consulted before every table above, so a preset
# can claim a chord the shared tables also bind, and a chord listed here is live only while its own
# preset is selected. GM's ruling, 2026-09-06: every preset reaches every action this table governs,
# so default and vim carry the three view chords SettingsKeys.html's inventory leaves as a dash. On
# every other row a preset governs the shared tables already bind a bare key, and Default is what a
# missing or unknown name means. A chord claimed twice inside one preset is a generator error, which
# is SettingsKeys.html's "Conflicts fail the build"; across presets there is nothing to check.
# mods is "ctrl" for a chord with Control and no Shift, "ctrlshift" for both. keys is what the Keys
# section prints beside the label, and it is spelled the way SettingsKeys.html spells a chord. Each
# block writes name, mods, key, keys, action, then label, in that order.

# The three views are bound in no shared table, so a preset claiming nothing left a fresh install
# with no keyboard route to them at all, on a keyboard-first file manager. Default and Vim take the
# spelling the Mac rows below already use, because only one preset is ever live and the two never
# meet; the bare digits are tab1 through tab9, so a chord is the only free shape here.
[[preset]]
name = "default"
mods = "ctrl"
key = "1"
keys = "ctrl-1"
action = "viewList"
label = "list view"

[[preset]]
name = "default"
mods = "ctrl"
key = "2"
keys = "ctrl-2"
action = "viewColumns"
label = "columns view"

[[preset]]
name = "default"
mods = "ctrl"
key = "3"
keys = "ctrl-3"
action = "viewGrid"
label = "grid view"

[[preset]]
name = "vim"
mods = "ctrl"
key = "1"
keys = "ctrl-1"
action = "viewList"
label = "list view"

[[preset]]
name = "vim"
mods = "ctrl"
key = "2"
keys = "ctrl-2"
action = "viewColumns"
label = "columns view"

[[preset]]
name = "vim"
mods = "ctrl"
key = "3"
keys = "ctrl-3"
action = "viewGrid"
label = "grid view"

# Finder's own chords, read with Cmd as Ctrl the way Omarchy's universal clipboard already delivers
# them; ui/js/Keymap.js's shared ctrl table keeps only the chords both platforms agree on.
[[preset]]
name = "mac"
mods = "ctrl"
key = "1"
keys = "ctrl-1"
action = "viewList"
label = "list view"

[[preset]]
name = "mac"
mods = "ctrl"
key = "2"
keys = "ctrl-2"
action = "viewColumns"
label = "columns view"

[[preset]]
name = "mac"
mods = "ctrl"
key = "3"
keys = "ctrl-3"
action = "viewGrid"
label = "grid view"

[[preset]]# Historical Ctrl navigation aliases remain additive.

name = "mac"
mods = "ctrl"
key = "Up"
keys = "ctrl-up"
action = "parent"
label = "up one level"

[[preset]]# Historical Ctrl navigation aliases remain additive.

name = "mac"
mods = "ctrl"
key = "Down"
keys = "ctrl-down"
action = "open"
label = "open"

[[preset]]# Historical Ctrl navigation aliases remain additive.

name = "mac"
mods = "ctrl"
key = "Delete"
keys = "ctrl-delete"
action = "trash"
label = "move to trash"

# Finder's Connect to Server. Bare a stays a shared key, so the Windows preset loses only the chord.
[[preset]]
name = "mac"
mods = "ctrl"
key = "K"
keys = "ctrl-k"
action = "addNetwork"
label = "connect to server"

# Explorer's own chords. Backspace, Delete, F2, Ctrl+A, Ctrl+C/V/X, Ctrl+Z, Ctrl+F and Ctrl+Shift+N
# are already in the shared tables because Finder and Explorer agree on them; these are the four
# this product can honour where they differ.
[[preset]]
name = "windows"
mods = "ctrl"
key = "H"
keys = "ctrl-h"
action = "toggleHidden"
label = "hidden files"

[[preset]]
name = "windows"
mods = "ctrlshift"
key = "1"
keys = "ctrl-shift-1"
action = "viewList"
label = "list view"

[[preset]]
name = "windows"
mods = "ctrlshift"
key = "2"
keys = "ctrl-shift-2"
action = "viewColumns"
label = "columns view"

[[preset]]
name = "windows"
mods = "ctrlshift"
key = "3"
keys = "ctrl-shift-3"
action = "viewGrid"
label = "grid view"

[[shift]]
key = "Down"
action = "extendDown"

[[shift]]
key = "Up"
action = "extendUp"

# Bindings on the key code, for the keys that carry no printable character.
[[code]]
key = "Down"
action = "cursorDown"

[[code]]
key = "Up"
action = "cursorUp"

# Issue 28: the full-size keyboard's own four. Every one names an action the vim keys already carry,
# so ui/js/Focus.js takes them for free and tools/flea-acceptance derives each as its own driven
# item; Home and End are g and G, the page pair is Ctrl+U and Ctrl+D half a screen each, and the
# curated sheet below draws none of those eight, so all four of cursorFirst, cursorLast, pageUp and
# pageDown have no row on it.
[[code]]
key = "Home"
action = "cursorFirst"

[[code]]
key = "End"
action = "cursorLast"

[[code]]
key = "PageUp"
action = "pageUp"

[[code]]
key = "PageDown"
action = "pageDown"

[[code]]
key = "Return"
action = "open"

[[code]]
key = "Enter"
action = "open"

[[code]]
key = "Backspace"
action = "parent"

[[code]]
key = "Delete"
action = "trash"

[[code]]
key = "Escape"
action = "escape"

# The only thing that moves focus between the list and the rail, see ui/js/Focus.js.
[[code]]
key = "Tab"
action = "focusNext"

# Space already owns "open preview" in the browsing state ui/js/Focus.js act handles, and
# ui/js/PreviewKeys.js act reuses the same action name to mean "close" once a preview is open, on
# every kind including media, so there is no free context left for a third meaning; v toggles selection.
[[code]]
key = "Space"
action = "preview"

# F2 shares the "rename" action "r" carries below; ui/js/Focus.js dispatches it by focus view.
[[code]]
key = "F2"
action = "rename"

# Task 22: seeking, reachable only with a MEDIA preview open. ui/js/Focus.js's lookup discards
# these the same way it already discards addNetwork outside the rail, so Left/Right stay silent
# everywhere else rather than surfacing act()'s "not built yet" fallback while browsing.
[[code]]
key = "Left"
action = "seekBack"

[[code]]
key = "Right"
action = "seekForward"

# The character is authoritative for letters, so shift-g is distinguishable from g.
[[text]]
char = "j"
action = "cursorDown"

[[text]]
char = "k"
action = "cursorUp"

[[text]]
char = "g"
action = "cursorFirst"

[[text]]
char = "G"
action = "cursorLast"

# GM's ruling, 2026-09-01: the keymap sheet's own letters. Selection moved off x, which now cuts,
# onto v, which is also the TUI board's visual-mode key.
[[text]]
char = "v"
action = "toggleSelect"

[[text]]
char = "J"
action = "extendDown"

[[text]]
char = "K"
action = "extendUp"

[[text]]
char = "h"
action = "parent"

# Narrows the rows already listed, in place and with no round trip. ui/js/Focus.js keeps it to the
# list view, the one the canvas draws a filter in, the same way it keeps addNetwork to the rail.
[[text]]
char = "/"
action = "filter"

# Search walks the subtree under the current directory; filter above narrows what is already listed.
[[text]]
char = "f"
action = "search"

# Only means something on a search result, so ui/js/Focus.js drops it everywhere else and o stays type-ahead.
[[text]]
char = "o"
action = "reveal"

# The path bar's own key, the vim line-command colon it is drawn as on the Tui board. Ctrl+L above
# is the same action under the chord every browser and every GTK file manager already carries.
[[text]]
char = ":"
action = "pathBar"

[[text]]
char = "t"
action = "tabNew"

[[text]]
char = "w"
action = "tabClose"


[[text]]
char = "y"
action = "copy"

# The capital-is-the-variant shape g/G, j/J and s/S already use: y takes the file, Y takes the route.
[[text]]
char = "Y"
action = "copydirpath"

[[text]]
char = "x"
action = "cut"

[[text]]
char = "p"
action = "paste"

# Two presses, because a single d sat in the middle of the letters a name is typed with and trashed
# the row on the third keystroke of "Vid". Delete and Ctrl+Delete still go on one press.
[[text]]
char = "d"
action = "trashArm"
keys = "dd"

[[text]]
char = "r"
action = "rename"

# The canvas draws this on the keymap sheet and again in the status line after a trash ("z undoes"),
# so it is the one key the shipped table was missing rather than a new invention.
[[text]]
char = "z"
action = "undo"

# The TUI board draws "s cycles, r reverses", but r is rename in both front ends and the canvas's
# own Operations sheet draws it that way, so the reverse key is S: the capital-is-the-variant shape
# g/G, j/J and J/K already use. s steps only through the orders the backend can really produce,
# see ui/js/Sort.js; the columns it cannot are refused on an aimed click instead.
[[text]]
char = "s"
action = "sortNext"

[[text]]
char = "S"
action = "sortReverse"

[[text]]
char = "."
action = "toggleHidden"

# Opens the Network group's add-location popup; works from either the list or the rail.
[[text]]
char = "a"
action = "addNetwork"

# The keyboard's way into the menu a right click raises: the row's own menu in the listing, Eject
# and Unmount in the rail. The tagline is "keyboard-first" and before this key neither had one, so
# m is no longer a type-ahead letter; ui/js/Focus.js routes it by which view has focus.
[[text]]
char = "m"
action = "menu"

# The Settings board's own key: "," from anywhere in the window, no modifier chord, because
# Omarchy's universal clipboard consumes SUPER+C/V/X and a settings panel is the last place to
# fight for one. ui/Pane.qml routes it from the list and from the rail alike.
[[text]]
char = ","
action = "settings"

# The sheet's own key. Shift falls through to the text switch, so ? needs no [[shift]] row.
[[text]]
char = "?"
action = "keymapSheet"

# The PDF viewer's own three, reachable only with a PDF preview open. ui/js/Focus.js discards them
# everywhere else, the same way it already discards addNetwork outside the rail. Expand takes e
# because f is search and Space is preview; the canvas names no key, GM ruled that it gets one.
[[text]]
char = "-"
action = "zoomOut"

[[text]]
char = "+"
action = "zoomIn"

[[text]]
char = "e"
action = "expand"

# The page pair: h goes back in a PDF or to the parent while browsing; l goes forward, enters a directory, or previews a file.
[[text]]
char = "l"
action = "pageForward"

# The digit range, expanded by the generator into tab1 through tab9.
[digits]
from = 1
to = 9
prefix = "tab"

# The keymap sheet ? opens, in the order the canvas's Keys panel draws it, two columns down.
# A chord shares the row of the key it doubles, written ^c for ctrl and ^N (a capital, the table's
# own shift convention) for ctrl-shift, so the sheet stays two columns. Two rows keep the bare key
# alone: "f ^f" beside "find in subtree" and "a ^k" beside "add network place" overrun the 154 px
# column at base-size 14 in JetBrainsMono (155 and 169 px measured); the README carries those two.
# keys is what the cap prints, action is what the first of those keys must resolve to, and label is
# the wording. tests/js/keymap.js checks every action against the table above, so a row here cannot
# advertise a key that is not bound. Each block writes keys, then action, then label, in that order.

[[sheet]]
keys = "j k"
action = "cursorDown"
label = "move"

[[sheet]]
keys = "enter"
action = "open"
label = "open"

[[sheet]]
keys = "l"
action = "pageForward"
label = "browse forward"

[[sheet]]
keys = "space"
action = "preview"
label = "preview"

# The canvas's Operations board draws / between space and f, and so does this.
[[sheet]]
keys = "/"
action = "filter"
label = "filter"

[[sheet]]
keys = "f"
action = "search"
label = "find in subtree"

[[sheet]]
keys = "o"
action = "reveal"
label = "reveal result"

# Issue 30 asked for a way to search the folder the pane is in, and tab on the query line is it, so
# the sheet draws the key here rather than leaving the only control the issue got undocumented.
[[sheet]]
keys = "tab"
action = "focusNext"
label = "search scope, or focus"

[[sheet]]
keys = ": ^l"
action = "pathBar"
label = "go to path"

[[sheet]]
keys = "y ^c"
action = "copy"
label = "copy"

[[sheet]]
keys = "Y"
action = "copydirpath"
label = "copy folder path"

[[sheet]]
keys = "x ^x"
action = "cut"
label = "cut"

[[sheet]]
keys = "p ^v"
action = "paste"
label = "paste"

[[sheet]]
keys = "r"
action = "rename"
label = "rename"

[[sheet]]
keys = "dd"
action = "trashArm"
label = "trash"

[[sheet]]
keys = "z ^z"
action = "undo"
label = "undo"

[[sheet]]
keys = "^N"
action = "newFolder"
label = "new folder"

[[sheet]]
keys = "v"
action = "toggleSelect"
label = "select"

[[sheet]]
keys = "s"
action = "sortNext"
label = "sort column"

[[sheet]]
keys = "S"
action = "sortReverse"
label = "reverse sort"

[[sheet]]
keys = ". ^>"
action = "toggleHidden"
label = "hidden files"

[[sheet]]
keys = "a"
action = "addNetwork"
label = "add network place"

[[sheet]]
keys = "m"
action = "menu"
label = "context menu"

[[sheet]]
keys = "^e"
action = "eject"
label = "eject"

[[sheet]]
keys = "^t"
action = "openTerminal"
label = "open terminal"

[[sheet]]
keys = "^+"
action = "textSizeUp"
label = "text size up"

[[sheet]]
keys = "^-"
action = "textSizeDown"
label = "text size down"

[[sheet]]
keys = ","
action = "settings"
label = "settings"

[[sheet]]
keys = "?"
action = "keymapSheet"
label = "this sheet"

# The pointer contract, the mouse's half of this table. tools/flea-keymap-gen turns it into
# Keymap.POINTER and tests/js/tap.js drives ui/js/Tap.js against every listing and neighbour row, so
# a click cannot change meaning without this file saying so and this file cannot advertise a click
# the code does not make.
#
# The effect field is "does" and not "action" on purpose. tools/flea-acceptance derives its whole key
# checklist from every 'action = ' line in this file, without scoping to a table, so an action= here
# would put a key on that checklist that nobody can press. Do not rename it back.
#
# where  listing    the list view, the grid view, and the columns view's own middle column
#        column     the columns view's middle column alone, which answers every listing row above
#                   and then the one row of its own that the other two views do not carry
#        neighbour  the columns view's parent and child columns, which are peeks with no cursor
#        rail       ui/SidebarRow.qml: favourites, mounts and network places
#        window     a press that belongs to no row at all, taken by ui/shell.qml
#        chrome     ui/ChromeBar.qml's path above the listing, whose segments are their own targets
# press  the button, then any modifier before it, then "x2" for the second tap of a double click
# row    which rows the line covers: any, dir, file, parent, renaming or result
# does   backOrParent commitRename extendSelect goToCrumb menu nothing open pathBar reveal selectOnly toggleSelect
#
# Enter opens and is in the [[code]] table above, not here: this is the pointer's half only. The rail
# opens on one tap, as Finder's own sidebar does and as every other rail in Omarchy does, which is
# why the listing's two-tap rule stops at the rail's edge.

[[pointer]]
where = "listing"
press = "left"
row = "any"
does = "selectOnly"
label = "put the cursor on the row and drop any other selection"

[[pointer]]
where = "listing"
press = "left x2"
row = "any"
does = "open"
label = "open the row"

# The operator's ruling on a search result: clicking one takes you to the file rather than launching
# it, and one tap is what does it (2026-09-11), because a result you clicked is a result you are done
# reading. ui/js/Search.js activateAction is what decides, and it answers "open" everywhere else,
# which is why the row above still stands. Enter still opens and o still reveals, so only the pointer
# reads the search this way. The reveal moves the pane, so the second tap of a double click lands on
# another directory's row: it is declared below as doing nothing, the neighbour columns' own rule.
[[pointer]]
where = "listing"
press = "left"
row = "result"
does = "reveal"
label = "go to the file in its own directory, selected"

[[pointer]]
where = "listing"
press = "left x2"
row = "result"
does = "reveal"
label = "still the one reveal the first tap made"

[[pointer]]
where = "listing"
press = "ctrl left"
row = "any"
does = "toggleSelect"
label = "add the row to the selection"

[[pointer]]
where = "listing"
press = "shift left"
row = "any"
does = "extendSelect"
label = "extend the selection to the row"

# A modifier never opens, whatever the tap count, and only the first tap of one counts: a ctrl-held
# double click that toggled twice would put the selection back where it started.
[[pointer]]
where = "listing"
press = "ctrl left x2"
row = "any"
does = "toggleSelect"
label = "still only selects"

[[pointer]]
where = "listing"
press = "shift left x2"
row = "any"
does = "extendSelect"
label = "still only selects"

# Finder commits an inline rename when you click away. A TapHandler never moves Qt focus, so
# ui/RenameField.qml's onActiveFocusChanged cannot carry this and ui/js/Tap.js asks the pane
# explicitly. The keyboard survives the close because the field gives up focus when it hides, in
# ui/RenameField.qml, and not because the view takes focus back: forcing focus onto a ListView
# re-selects the hidden field, which is the focus scope's remembered child.
[[pointer]]
where = "listing"
press = "left"
row = "renaming"
does = "commitRename"
label = "commit the open rename, then select the row"

# The pressed row decides which rows the menu means, ui/js/Drag.js carried()'s rule for the pointer's
# other gesture. A menu raised inside a multi-row selection acts on all of it, as Finder does, and one
# raised outside collapses the selection to that row, because every entry the menu draws is built from
# the cursor row while Move to Trash, Compress and Move to Dropbox all dispatch through the selection.
[[pointer]]
where = "listing"
press = "right"
row = "any"
does = "menu"
label = "open the context menu at the pointer, on the selection the row is in"

# The operator's ruling, 2026-09-11: the columns view goes into a directory on one tap, the way both
# of its own neighbour columns already do and the way Finder's column view does. Only a directory and
# only here: a file in this column still waits for the second tap, and one tap in the list and the
# grid still only selects. ui/ColumnsArea.qml is the sole caller of ui/js/Tap.js tappedMiddle, which
# is what scopes this to the middle column; a modifier still selects, because it never opens anywhere.
[[pointer]]
where = "column"
press = "left"
row = "dir"
does = "open"
label = "go into that directory on one tap, as its neighbours do"

# A neighbour column has no cursor, so one tap on a directory makes it the pane's own listing: that is
# the column view's reveal, the gesture Finder's own column view answers a single click with, and not
# an open. A file has nothing to reveal, so it waits for the second tap.
[[pointer]]
where = "neighbour"
press = "left"
row = "dir"
does = "reveal"
label = "show that directory in the middle column"

[[pointer]]
where = "neighbour"
press = "left"
row = "file"
does = "nothing"
label = "a file has no contents to reveal"

[[pointer]]
where = "neighbour"
press = "left x2"
row = "file"
does = "open"
label = "open the file"

# Every menu action addresses the pane's cursor and a peeked row is another directory's, so the two
# neighbour columns raise no menu at all rather than one whose entries would act somewhere else.
[[pointer]]
where = "neighbour"
press = "right"
row = "any"
does = "nothing"
label = "a peeked row has no menu"

# Issue 45: the path above the listing is a control now as well as a label. Every segment but the
# leaf opens its own directory on one tap, through the same pathEntered route the typed bar uses; the
# leaf is the directory already listed, so it has nowhere of its own to go, and the frozen List view
# board draws it in the foreground role while every segment above it is muted. The row column reads
# "parent" for that reason: a row saying "crumb" would promise a press the leaf never answers. The
# double click that opens the bar is declared beside it because the crumb answers that press too:
# the tap count alone decides between them, and neither runs with the other, measured on the box.
[[pointer]]
where = "chrome"
press = "left"
row = "parent"
does = "goToCrumb"
label = "open the directory that segment of the path names"

[[pointer]]
where = "chrome"
press = "left x2"
row = "any"
does = "pathBar"
label = "type the path instead of clicking it"

# Issue 20: the mouse's extra button. It belongs to the window rather than to a row, so it is the one
# line here with no listing under it; ui/js/Nav.js mouseBack decides, and ui/shell.qml refuses it
# behind a dialog, an open preview, the share overlay and any field holding the keyboard.
[[pointer]]
where = "window"
press = "back"
row = "any"
does = "backOrParent"
label = "go back through the history, or up a directory when there is none"

[[pointer]]
where = "rail"
press = "left"
row = "any"
does = "open"
label = "open the place"

[[pointer]]
where = "rail"
press = "right"
row = "any"
does = "menu"
