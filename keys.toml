# Issue 28: the full-size keyboard's own four. Every one names an action the vim keys already carry,
# so ui/js/Focus.js takes them for free and tools/flea-acceptance derives each as its own driven
# item; Home and End are g and G, the page pair is Ctrl+U and Ctrl+D half a screen each, and the
# curated sheet below draws none of those eight, so all four of cursorFirst, cursorLast, pageUp and
# pageDown have no row on it.
[[code]]
key = "Home"
action = "cursorFirst"
label = "First item"

[[code]]
