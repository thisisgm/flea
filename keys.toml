action = "open"

[[code]]
key = "Backspace"
action = "parent"

[[code]]
key = "Delete"
action = "trash"

[[code]]
key = "Escape"
action = "escape"
label = "Close or go back"

# The only thing that moves focus between the list and the rail, see ui/js/Focus.js.
[[code]]
key = "Tab"
action = "focusNext"

# Space already owns "open preview" in the browsing state ui/js/Focus.js act handles, and
# ui/js/PreviewKeys.js act reuses the same action name to mean "close" once a preview is open, on
# every kind including media, so there is no free context left for a third meaning; v toggles selection.
[[code]]
key = "Space"
action = "preview"

# F2 shares the "rename" action "r" carries below; ui/js/Focus.js dispatches it by focus view.
[[code]]
key = "F2"
action = "rename"

# F5 re-reads the folder through the listing swap, the way a watched change does; the
# notice names how many rows changed, and only when rows changed. TrashView owns its own.
[[code]]
key = "F5"
action = "reload"

# Decided 2026-09-13: the arrows are the letter pair's own spelling, so Left is h's parent and
# Right is l's browse-in, in the list, the columns and both dual panes. A preview takes them back
# through the preview-context rows at the end of this file, where they seek in media and turn the
# page in a PDF, and the grid claims them as its own sideways move in ui/js/Focus.js before the map
# is consulted at all. They were seekBack and seekForward here, which ui/js/Focus.js then discarded
# everywhere but the grid, so the two arrows did nothing at all while browsing.
[[code]]
key = "Left"
action = "parent"

[[code]]
key = "Right"
action = "pageForward"

# The character is authoritative for letters, so shift-g is distinguishable from g.
[[text]]
char = "j"
action = "cursorDown"

[[text]]
char = "k"
action = "cursorUp"
label = "Cursor up"

[[text]]
char = "g"
action = "cursorFirst"
label = "First item"

[[text]]
char = "G"
action = "cursorLast"
label = "Last item"

# Decided 2026-09-01: the keymap sheet's own letters. Selection moved off x, which now cuts,
# onto v, which is also the TUI board's visual-mode key.
[[text]]
char = "v"
action = "toggleSelect"

[[text]]
char = "J"
action = "extendDown"
label = "Extend down"

[[text]]
char = "K"
action = "extendUp"
label = "Extend up"

[[text]]
char = "h"
action = "parent"

# Narrows the rows already listed, in place and with no round trip, in every view; ui/js/Focus.js
# drops it only while a search owns the header.
[[text]]
char = "/"
action = "filter"

# Search walks the subtree under the current directory; filter above narrows what is already listed.
[[text]]
char = "f"
action = "search"

# Only means something on a search result, so ui/js/Focus.js drops it everywhere else and o stays type-ahead.
[[text]]
char = "o"
action = "reveal"

# The path bar's own key, the vim line-command colon it is drawn as on the Tui board. Ctrl+L above
# is the same action under the chord every browser and every GTK file manager already carries.
[[text]]
char = ":"
action = "pathBar"

[[text]]
char = "t"
action = "tabNew"
label = "New tab"

# The Tags flyout's own key, from the listing; the seven digits toggle while that list is open.
[[text]]
char = "T"
action = "tags"

# Swaps the preview column's compact facts line for the full table (ui.json previewFacts); a no-op unless that column is on screen.
[[text]]
char = "i"
action = "factsToggle"

[[text]]
char = "w"
action = "tabClose"
label = "Close tab"


[[text]]
char = "y"
action = "copy"

# The capital-is-the-variant shape g/G, j/J and s/S already use: y takes the file, Y takes the route.
[[text]]
char = "Y"
action = "copydirpath"

[[text]]
char = "x"
action = "cut"

[[text]]
char = "p"
action = "paste"

# Two presses, because a single d sat in the middle of the letters a name is typed with and trashed
# the row on the third keystroke of "Vid". Delete and Ctrl+Delete still go on one press.
[[text]]
char = "d"
action = "trashArm"
keys = "dd"

[[text]]
char = "r"
action = "rename"

# The canvas draws this on the keymap sheet and again in the status line after a trash ("z undoes"),
# so it is the one key the shipped table was missing rather than a new invention.
[[text]]
char = "z"
action = "undo"

# The TUI board draws "s cycles, r reverses", but r is rename in both front ends and the canvas's
# own Operations sheet draws it that way, so the reverse key is S: the capital-is-the-variant shape
# g/G, j/J and J/K already use. s steps only through the orders the backend can really produce,
# see ui/js/Sort.js; the columns it cannot are refused on an aimed click instead.
[[text]]
char = "s"
action = "sortNext"

[[text]]
char = "S"
action = "sortReverse"

[[text]]
char = "."
action = "toggleHidden"

# Opens the Network group's add-location popup; works from either the list or the rail.
[[text]]
char = "a"
action = "addNetwork"

# Opens Omarchy's default agent in the folder being shown, the menu's Open in Agent with no menu.
[[text]]
char = "A"
action = "openAgent"
label = "Open agent here"

# The keyboard's way into the menu a right click raises: the row's own menu in the listing, Eject
# and Unmount in the rail. The tagline is "keyboard-first" and before this key neither had one, so
# m is no longer a type-ahead letter; ui/js/Focus.js routes it by which view has focus.
[[text]]
char = "m"
action = "menu"

# MenuAdditions040: c opens Copy as at the cursor, P opens Paste as, and V
# flips the selection; c, P and V work with the rows hidden, like every key.
[[text]]
char = "c"
action = "copyAs"
label = "Copy as"

[[text]]
char = "P"
action = "pasteAs"
label = "Paste as"

[[text]]
char = "V"
action = "invertSelection"
label = "Invert selection"

# The Settings board's own key: "," from anywhere in the window, no modifier chord, because
# Omarchy's universal clipboard consumes SUPER+C/V/X and a settings panel is the last place to
# fight for one. ui/Pane.qml routes it from the list and from the rail alike.
[[text]]
char = ","
action = "settings"

# The sheet's own key. Shift falls through to the text switch, so ? needs no [[shift]] row.
[[text]]
char = "?"
action = "keymapSheet"

# The PDF viewer's own three, reachable only with a PDF preview open. ui/js/Focus.js discards them
# everywhere else. Expand takes e because f is search and Space is preview; the canvas names no key,
# but it gets one.
[[text]]
char = "-"
action = "zoomOut"
label = "Zoom out"

[[text]]
char = "+"
action = "zoomIn"
label = "Zoom in"

[[text]]
char = "e"
action = "expand"
label = "Expand"

# The page pair: h goes back in a PDF or to the parent while browsing; l goes forward, enters a directory, or previews a file.
[[text]]
char = "l"
action = "pageForward"

# Tabs040 callout 1: { and } move the current tab one place, the keys beside the
# drag. The character is authoritative, so these need no [[shift]] row the way the
# text-less arrows do; both are free in all four presets.
[[text]]
char = "{"
action = "tabMoveLeft"
label = "Move tab left"

[[text]]
char = "}"
action = "tabMoveRight"
label = "Move tab right"

# Keys040: [ and ] step to the previous and next tab. Bare text like { and }
# above; the only BracketLeft/BracketRight rows in any preset are mac's
# super-modified history chords, a different modifier state, so both are free
# in all four presets.
[[text]]
char = "["
action = "tabPrevious"
label = "Previous tab"
