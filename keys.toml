# KeymapSheet.html rule 1: a binding gets a group and the sheet reads it. The group is named by
# action rather than written on every binding, because one action is spelled four different ways
# across the presets and its group is the same in all four; the generator fails the build if an
# action the listing binds is missing here or named twice. The order is the order the sheet draws,
# and the heading is the key with its first letter capitalised.
# Move is where the cursor, the pane or the window goes. Look is what is drawn and how big. Find
# narrows or orders what is already listed. Change writes something, or opens the surface that does.
[sheetgroups]
move = ["cursorDown", "cursorUp", "cursorFirst", "cursorLast", "pageDown", "pageUp", "open",
        "parent", "pageForward", "historyBack", "historyForward", "focusNext", "focusPrevious", "focusPreview",
        "tabNew", "openTab", "tabClose", "tabNext", "tabPrevious", "tabMoveLeft", "tabMoveRight", "windowNew", "escape",
        "carry"]
look = ["viewList", "viewColumns", "viewGrid", "viewDual", "togglePreview", "factsToggle", "loadPreview", "preview", "previewPageForward", "previewPageBack",
        "toggleHidden", "sidebar", "zoomIn", "zoomOut", "expand", "openInPlace", "closeInPlace", "mute", "textSizeUp", "textSizeDown",
        "textSizeReset", "keymapSheet"]
find = ["filter", "search", "searchContents", "reveal", "sortNext", "sortReverse", "pathBar", "reload"]
change = ["copy", "cut", "paste", "movePaste", "duplicate", "rename", "trash",
          "deletePermanently", "undo", "redo", "newFolder", "copydirpath", "copyPath", "openAgent",
          "toggleSelect", "selectAll", "extendDown", "extendUp", "menu", "properties", "addNetwork", "eject",
          "openTerminal", "settings", "autofitColumns", "copyAs", "pasteAs", "invertSelection", "tags"]

# The digit range, expanded by the generator into tab1 through tab9.
[digits]
from = 1
to = 9
prefix = "tab"

[sheetoptions]
cap_budget = 16
mirrors = [
    ["cursorDown", "cursorUp"], ["cursorFirst", "cursorLast"], ["pageDown", "pageUp"],
    ["historyBack", "historyForward"], ["tabNext", "tabPrevious"], ["tabMoveLeft", "tabMoveRight"],
    ["zoomIn", "zoomOut"], ["textSizeUp", "textSizeDown"], ["extendDown", "extendUp"]
]

# Spellings that win a sheet cap tie, per preset name; "all" applies to every preset.
[sheetties]
all = ["left", "shift-f10", "ctrl-shift-plus", "ctrl-shift-minus", "ctrl-shift-0"]
default = ["ctrl-c", "ctrl-v"]
windows = ["ctrl-c", "ctrl-v"]

