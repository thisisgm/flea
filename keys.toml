mods = "ctrl"
key = "4"
keys = "ctrl-4"
action = "viewDual"
label = "Dual pane"

[[preset]]
name = "vim"
mods = "ctrl"
key = "1"
keys = "ctrl-1"
action = "viewList"
label = "List view"

[[preset]]
name = "vim"
mods = "ctrl"
key = "2"
keys = "ctrl-2"
action = "viewColumns"
label = "Columns view"

[[preset]]
name = "vim"
mods = "ctrl"
key = "3"
keys = "ctrl-3"
action = "viewGrid"
label = "Grid view"

[[preset]]
name = "vim"
mods = "ctrl"
key = "4"
keys = "ctrl-4"
action = "viewDual"
label = "Dual pane"

