# The one key table. tools/flea-keymap-gen emits frozen-compatible JavaScript and native Rust data.

# Control-modified keys are checked first, so plain d can mean cut while ctrl-d pages.
[[ctrl]]
key = "D"
action = "pageDown"
label = "Page down"

[[ctrl]]
key = "U"
action = "pageUp"
label = "Page up"

[[ctrl]]
key = "A"
action = "selectAll"
label = "Select all"

# Finder's table with Cmd read as Ctrl, which is also what Omarchy's universal clipboard injects
# (SUPER+C/V/X arrive here as CTRL+C/V/X, see clipboard.lua) and what GTK binds. Every chord is
# additive: the bare vim key beside it stays. Cmd+D is the one Finder chord not taken, because
# Ctrl+D above already pages with Ctrl+U as its pair; Duplicate stays a menu row.
[[ctrl]]
key = "C"
action = "copy"

[[ctrl]]
key = "V"
action = "paste"

[[ctrl]]
key = "X"
action = "cut"

[[ctrl]]
key = "Z"
action = "undo"

[[ctrl]]
key = "F"
action = "search"

# Ctrl+G opens search on this folder already in contents mode; inside the strip it turns names and contents.
[[ctrl]]
key = "G"
action = "searchContents"

# Finder's Cmd+E. ui/js/Eject.js "release" ejects the rail's cursor row or the removable volume the
# listing is inside, with the verdict from Mounts.railMenu, off the lsblk poll, never an exit code.
[[ctrl]]
key = "E"
action = "eject"

# RailAdditions rule 4 (issue 112, muellan): the rail hides and comes back on the chord every editor
# binds for its own sidebar, and the choice is remembered in ui.json the way the view is.
[[ctrl]]
key = "B"
action = "sidebar"
label = "Sidebar"

# Not a Finder chord: Cmd+Shift+G is Go to Folder there, and Ctrl+Shift+G is nothing on this box.
# Ctrl+L is what Nautilus, Thunar, Dolphin and every browser bind, so the path bar answers to it too.
[[ctrl]]
key = "L"
action = "pathBar"

# Opens the default terminal in the directory being shown, through flea --terminal
# (xdg-terminal-exec --dir=). Ctrl+T is unbound elsewhere here, and bare t below is tabNew.
[[ctrl]]
key = "T"
action = "openTerminal"

# Ctrl+Return opens the cursor folder in a new tab, the keyboard twin of the
# middle click keys.toml already ships (Tap.tappedTab). Nautilus binds the same.
[[ctrl]]
key = "Return"
action = "openTab"

[[ctrl]]
key = "Enter"
action = "openTab"

# The browser's own reload chord beside F5 above; every preset leaves both free.
[[ctrl]]
key = "R"
action = "reload"
# The settings panel's own chord, spelled ctrl-, by both presets and by every editor that has one;
# the bare comma below is the key the Settings board draws beside the toolbar's sliders button.
[[ctrl]]
key = "Comma"
action = "settings"

# Checked before the plain ctrl rows and falling through when unmatched, so Ctrl+Shift+D still
# pages. Ctrl+Shift+N is Nautilus's own New Folder and Finder's with Cmd read as Ctrl, and the
# window reaches the backend's mkdir through Ops.newFolder. Shift+period is delivered as Greater
# on a US layout and as Period elsewhere, so both rows name the one action.
[[ctrlshift]]
key = "N"
action = "newFolder"

# Issue 9: foot's own zoom chords, which in foot are a text size and are one here too. They are an
# alias onto the Display section's own control and its one stored stop, never a second engine. Plus
# and Equal both, because + is Shift+= on a US layout and the hand presses the one key either way.
# Ctrl++ without that Shift arrives as Equal, and Qt can report Plus with Control alone, so the
# same three actions answer on Control by itself. 0 goes back to following Omarchy.
[[ctrl]]
key = "Plus"
action = "textSizeUp"

[[ctrl]]
key = "Equal"
action = "textSizeUp"

[[ctrl]]
key = "Minus"
action = "textSizeDown"

[[ctrl]]
key = "0"
action = "textSizeReset"

[[ctrlshift]]
key = "Plus"
action = "textSizeUp"

[[ctrlshift]]
key = "Equal"
action = "textSizeUp"

[[ctrlshift]]
key = "Minus"
action = "textSizeDown"

[[ctrlshift]]
key = "Underscore"
action = "textSizeDown"

[[ctrlshift]]
key = "0"
action = "textSizeReset"

[[ctrlshift]]
key = "Greater"
action = "toggleHidden"

[[ctrlshift]]
key = "Period"
action = "toggleHidden"

# Tabs040 callout 1: the reorder keys beside the drag. Checked before the plain
# ctrl rows, so Ctrl+Shift+PageUp never falls through to a tab switch.
[[ctrlshift]]
key = "PageUp"
action = "tabMoveLeft"
label = "Move tab left"

[[ctrlshift]]
key = "PageDown"
action = "tabMoveRight"
label = "Move tab right"

# MenuAdditions040: Ctrl+Shift+C copies the selection's paths, one per line,
# through wl-copy, without opening a row; c opens Copy as at the cursor.
[[ctrlshift]]
key = "C"
action = "copyPath"
label = "Copy path"

# Shift falls through instead of returning, because shift-modified letters already carry their
# own capital text (see G below); this table only covers the arrow keys, which carry no text.
# The preset overlay, the four-value chooser the Keys settings section walks: default, vim, mac and
# windows, in SettingsKeys.html's own order. It is consulted before every table above, so a preset
# can claim a chord the shared tables also bind, and a chord listed here is live only while its own
# preset is selected. Decided 2026-09-06: every preset reaches every action this table governs,
# so default and vim carry the three view chords SettingsKeys.html's inventory leaves as a dash. On
# every other row a preset governs the shared tables already bind a bare key, and Default is what a
# missing or unknown name means. A chord claimed twice inside one preset is a generator error, which
# is SettingsKeys.html's "Conflicts fail the build"; across presets there is nothing to check.
# mods is "ctrl" for a chord with Control and no Shift, "ctrlshift" for both. keys is what the Keys
# section prints beside the label, and it is spelled the way SettingsKeys.html spells a chord. Each
# block writes name, mods, key, keys, action, then label, in that order.

# Carry is a GUI action; terminal presets keep X unbound.
[[preset]]
name = "all"
mods = "text"
key = "X"
keys = "X"
action = "carry"
frontend = "gui"
context = "listing"
label = "Carry to another app"

# The four views are bound in no shared table, so a preset claiming nothing left a fresh install
# with no keyboard route to them at all, on a keyboard-first file manager. Default and Vim take the
# spelling the Mac rows below already use, because only one preset is ever live and the two never
# meet; the bare digits are tab1 through tab9, so a chord is the only free shape here.
